services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casino_battle
      POSTGRES_USER: casino_battle
      # Local-development password only. Set a real secret for hosted environments.
      POSTGRES_PASSWORD: casino_battle_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino_battle -d casino_battle"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - casino_battle_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DATABASE_URL: postgres://casino_battle:casino_battle_dev_only@db:5432/casino_battle
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  casino_battle_postgres:
