name: Rust CI
on:
  push:
    branches: ["foundation/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/aurel_test
      TEST_DATABASE_URL: postgres://aurel_app:aurel_test_password@localhost:5432/aurel_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
