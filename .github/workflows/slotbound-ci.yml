name: Slotbound CI

on:
  push:
    branches: [main, "feat/**", "agents/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slotbound-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust domain, API and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Expand the one-time clean source archive
        if: hashFiles('.slotbound-bootstrap/*.b64') != ''
        shell: bash
        run: |
          set -euo pipefail
          cat .slotbound-bootstrap/*.b64 | base64 --decode | tar -xzf - --no-same-owner
          rm -rf .slotbound-bootstrap

      - name: Format sources and pin Rust dependencies
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          if ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1 || ! git diff --quiet -- crates Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock crates
            git commit -m "build: format Rust sources and pin dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust unit and integration tests
        run: cargo test --workspace --all-targets

      - name: Build release API
        run: cargo build --release --workspace

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check browser JavaScript syntax
        run: node --check web/app.js

      - name: Check browser and API contract
        run: python3 tools/check_contract.py

      - name: Test autonomous agent patch policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_slotbound_agent_cycle.py' -v

      - name: Upload source and build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slotbound-ci-evidence
          path: |
            Cargo.lock
            target/release/slotbound-api
          if-no-files-found: ignore
          retention-days: 7
