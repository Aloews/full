name: Slotbound Agent Auto Merge

on:
  pull_request:
    branches: [feat/slotbound-release-candidate]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: slotbound-agent-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.pull_request.base.ref == 'feat/slotbound-release-candidate' &&
      github.event.pull_request.head.ref == 'agents/slotbound-release-candidate' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Capture the exact candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,state,isDraft,baseRefName,headRefName,headRefOid,mergeStateStatus)"
          echo "$pr" > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" "$EXPECTED_SHA" <<'PY'
          import json, sys
          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          if pr.get("state") != "OPEN" or pr.get("isDraft") is not False:
              raise SystemExit("PR is not open and ready.")
          if pr.get("baseRefName") != "feat/slotbound-release-candidate" or pr.get("headRefName") != "agents/slotbound-release-candidate":
              raise SystemExit("Unexpected PR branch routing.")
          if pr.get("headRefOid") != expected:
              raise SystemExit("PR head changed; refusing stale candidate.")
          if pr.get("mergeStateStatus") != "CLEAN":
              raise SystemExit("PR merge state is not CLEAN; refusing merge.")
          PY
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for all checks to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        run: gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 10

      - name: Re-verify exact successful candidate and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs" > "$RUNNER_TEMP/checks.json"
          python3 - "$RUNNER_TEMP/checks.json" <<'PY'
          import json, sys
          checks = json.load(open(sys.argv[1], encoding="utf-8")).get("check_runs", [])
          quality = [c for c in checks if c.get("name") == "Rust domain, API and browser checks"]
          if not any(c.get("status") == "completed" and c.get("conclusion") == "success" for c in quality):
              raise SystemExit("Exact-head Slotbound CI is not green.")
          blockers = [c for c in checks if c.get("status") == "completed" and c.get("conclusion") in {"failure","cancelled","timed_out","action_required"}]
          if blockers:
              raise SystemExit("Blocking checks: " + ", ".join(c.get("name","unnamed") for c in blockers))
          PY
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,baseRefName,headRefName,headRefOid,mergeStateStatus > "$RUNNER_TEMP/pr-final.json"
          python3 - "$RUNNER_TEMP/pr-final.json" "$EXPECTED_SHA" <<'PY'
          import json, sys
          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          if pr.get("state") != "OPEN" or pr.get("isDraft") is not False:
              raise SystemExit("PR no longer open and ready.")
          if pr.get("baseRefName") != "feat/slotbound-release-candidate" or pr.get("headRefName") != "agents/slotbound-release-candidate":
              raise SystemExit("Unexpected base/head.")
          if pr.get("headRefOid") != sys.argv[2] or pr.get("mergeStateStatus") != "CLEAN":
              raise SystemExit("Stale SHA or non-clean merge state.")
          PY
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - name: Verify merged integration head and dispatch its CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/slotbound-release-candidate" --jq '.object.sha')"
          gh workflow run slotbound-ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/slotbound-release-candidate
          found=0
          for attempt in $(seq 1 120); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow slotbound-ci.yml --branch feat/slotbound-release-candidate --commit "$base_sha" --json databaseId,status,conclusion,headSha --limit 20)"
            run="$(jq -c --arg sha "$base_sha" '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last // empty' <<<"$runs")"
            status="$(jq -r '.status // empty' <<<"$run")"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
              if [[ "$conclusion" != "success" ]]; then
                echo "Merged base CI did not pass: $conclusion"
                exit 1
              fi
              found=1
              break
            fi
            sleep 10
          done
          test "$found" = "1"
          gh workflow run slotbound-agent-cycle.yml --repo "$GITHUB_REPOSITORY" --ref feat/slotbound-release-candidate
