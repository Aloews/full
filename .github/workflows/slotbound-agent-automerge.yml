name: Slotbound Agent Auto Merge

on:
  pull_request:
    branches: [feat/slotbound-gdd-agent-routing]
  workflow_run:
    workflows: ["Slotbound CI"]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: slotbound-agent-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'feat/slotbound-gdd-agent-routing' &&
        github.event.pull_request.head.ref == 'agents/slotbound-gdd' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)) ||
      (github.event_name == 'workflow_run' &&
        contains(fromJSON('["pull_request","workflow_dispatch"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.head_branch == 'agents/slotbound-gdd' &&
        github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve exact PR candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$EXPECTED_BRANCH" \
            --base feat/slotbound-gdd-agent-routing \
            --json number,headRefOid,isDraft > "$RUNNER_TEMP/open-prs.json"
          pr_number="$(jq -r --arg sha "$EXPECTED_SHA" \
            '.[] | select(.headRefOid == $sha and .isDraft == false) | .number' \
            "$RUNNER_TEMP/open-prs.json" | head -n 1)"
          if [[ -z "$pr_number" ]]; then
            echo "No non-draft PR matches the exact SHA and isolated base; refusing to merge."
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Wait for all PR checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        run: gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 10

      - name: Verify the exact successful candidate and merge its PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs" > "$RUNNER_TEMP/check-runs.json"
          python3 - "$RUNNER_TEMP/check-runs.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          checks = payload.get("check_runs", [])
          quality = [item for item in checks if item.get("name") == "Rust domain, API and browser checks"]
          if not quality or not any(item.get("status") == "completed" and item.get("conclusion") == "success" for item in quality):
              raise SystemExit("Exact-head Slotbound CI is not green; refusing to merge.")
          blocking = [item for item in checks if item.get("status") == "completed" and item.get("conclusion") in {"failure","cancelled","timed_out","action_required"}]
          if blocking:
              raise SystemExit("Blocking checks detected: " + ", ".join(item.get("name","unnamed") for item in blocking))
          PY
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,baseRefName,headRefOid > "$RUNNER_TEMP/pr-state.json"
          python3 - "$RUNNER_TEMP/pr-state.json" "$EXPECTED_SHA" <<'PY'
          import json, sys
          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_sha = sys.argv[2]
          if pr.get("state") != "OPEN" or pr.get("isDraft") is not False:
              raise SystemExit("PR is not open and ready; refusing to merge.")
          if pr.get("baseRefName") != "feat/slotbound-gdd-agent-routing":
              raise SystemExit("PR base does not match the isolated Slotbound integration branch.")
          if pr.get("headRefOid") != expected_sha:
              raise SystemExit("PR head changed after CI; refusing to merge stale SHA.")
          PY
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - name: Verify merged integration head and dispatch CI
        id: base_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/slotbound-gdd-agent-routing" --jq '.object.sha')"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          gh workflow run slotbound-ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/slotbound-gdd-agent-routing
          found=0
          for attempt in $(seq 1 120); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow slotbound-ci.yml --branch feat/slotbound-gdd-agent-routing --commit "$base_sha" --json databaseId,status,conclusion,headSha --limit 20)"
            run="$(jq -c --arg sha "$base_sha" '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last // empty' <<<"$runs")"
            status="$(jq -r '.status // empty' <<<"$run")"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
              if [[ "$conclusion" != "success" ]]; then
                echo "Merged base CI did not pass: $conclusion"
                exit 1
              fi
              found=1
              break
            fi
            sleep 10
          done
          test "$found" = "1"

      - name: Dispatch the next bounded agent task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gh workflow run slotbound-agent-cycle.yml --repo "$GITHUB_REPOSITORY" --ref feat/slotbound-gdd-agent-routing
