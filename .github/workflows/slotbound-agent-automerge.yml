name: Slotbound Agent Auto Merge

on:
  workflow_run:
    workflows: ["Slotbound CI"]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: slotbound-agent-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      contains(fromJSON('["pull_request","workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_branch == 'agents/slotbound-autonomy' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the exact successful candidate and merge its PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_BRANCH: agents/slotbound-autonomy
        shell: bash
        run: |
          set -euo pipefail

          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$EXPECTED_BRANCH" \
            --base main \
            --json number,headRefOid,isDraft > "$RUNNER_TEMP/open-prs.json"

          pr_number="$(jq -r --arg sha "$EXPECTED_SHA" \
            '.[] | select(.headRefOid == $sha and .isDraft == false) | .number' \
            "$RUNNER_TEMP/open-prs.json" | head -n 1)"

          if [[ -z "$pr_number" ]]; then
            echo "No non-draft agent PR matches the exact successful SHA; refusing to merge."
            exit 1
          fi

          gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 10

          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs" > "$RUNNER_TEMP/check-runs.json"
          python3 - "$RUNNER_TEMP/check-runs.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          checks = payload.get("check_runs", [])
          quality = [
              check for check in checks
              if check.get("name") == "Rust domain, API and browser checks"
          ]
          if not quality or not any(
              check.get("status") == "completed" and check.get("conclusion") == "success"
              for check in quality
          ):
              raise SystemExit("Exact-head Slotbound CI is not green; refusing to merge.")

          blocking = [
              check for check in checks
              if check.get("status") == "completed"
              and check.get("conclusion") in {"failure", "cancelled", "timed_out", "action_required"}
          ]
          if blocking:
              names = ", ".join(check.get("name", "unnamed check") for check in blocking)
              raise SystemExit(f"Blocking check result(s) detected: {names}")
          PY

          gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefOid > "$RUNNER_TEMP/pr-state.json"
          python3 - "$RUNNER_TEMP/pr-state.json" "$EXPECTED_SHA" <<'PY'
          import json
          import sys

          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_sha = sys.argv[2]
          if pr.get("state") != "OPEN":
              raise SystemExit("PR is not open; refusing to merge.")
          if pr.get("isDraft") is not False:
              raise SystemExit("PR is still a draft; refusing to merge.")
          if pr.get("baseRefName") != "main":
              raise SystemExit("PR base is not main; refusing to merge.")
          if pr.get("headRefOid") != expected_sha:
              raise SystemExit("PR head changed after CI; refusing to merge stale SHA.")
          PY

          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

          # GITHUB_TOKEN merges do not trigger another push workflow. Dispatch CI on
          # the new main head; the next agent cycle starts only after that CI succeeds.
          gh workflow run slotbound-ci.yml --repo "$GITHUB_REPOSITORY" --ref main
