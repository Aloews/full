name: Casino Battle CI

on:
  push:
    branches:
      - casino-battle/foundation
    paths:
      - "casino-battle/**"
      - ".github/workflows/casino-battle.yml"
  pull_request:
    paths:
      - "casino-battle/**"
      - ".github/workflows/casino-battle.yml"
  workflow_dispatch:

jobs:
  rust:
    name: Rust domain and server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casino-battle
    steps:
      - uses: actions/checkout@v4
      - name: Enforce strict 2D client contract
        run: python3 scripts/verify_2d_only.py
      - name: Install Godot 4.3
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import and parse strict 2D Godot project
        run: |
          Godot_v4.3-stable_linux.x86_64 --headless --editor --path client --quit
          Godot_v4.3-stable_linux.x86_64 --headless --path client --quit-after 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: casino-battle
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
