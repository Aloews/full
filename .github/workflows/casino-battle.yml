name: Casino Battle CI

on:
  push:
    branches:
      - casino-battle/foundation
    paths:
      - "casino-battle/**"
      - ".github/workflows/casino-battle.yml"
  pull_request:
    paths:
      - "casino-battle/**"
      - ".github/workflows/casino-battle.yml"
  workflow_dispatch:

jobs:
  rust:
    name: Rust domain and server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: casino_battle_ci
          POSTGRES_USER: casino_battle
          POSTGRES_PASSWORD: casino_battle_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casino_battle -d casino_battle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: casino-battle
    steps:
      - uses: actions/checkout@v4
      - name: Enforce strict 2D pixel-art client contract
        run: python3 scripts/verify_2d_only.py
      - name: Install Godot 4.3
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import and parse strict 2D Godot project
        run: |
          Godot_v4.3-stable_linux.x86_64 --headless --editor --path client --quit
          Godot_v4.3-stable_linux.x86_64 --headless --path client --quit-after 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: casino-battle
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - name: Run deterministic balance sample
        run: cargo run -p casino-battle-core --bin balance -- 1000
      - name: Build and smoke-test the HTTP server
        run: |
          cargo build -p casino-battle-server
          BIND_ADDR=127.0.0.1:3917 ./target/debug/casino-battle-server > /tmp/casino-battle-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3917/healthz > /tmp/casino-battle-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/casino-battle-health.json
          grep -q '"persistence":"development_memory_only"' /tmp/casino-battle-health.json
          run_json="$(curl --fail --silent --show-error -X POST \
            -H 'content-type: application/json' \
            -d '{}' http://127.0.0.1:3917/api/v1/runs)"
          run_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["run_id"])' <<< "$run_json")"
          curl --fail --silent --show-error "http://127.0.0.1:3917/api/v1/runs/$run_id" > /dev/null
          relic_status="$(curl --silent --output /tmp/casino-battle-no-relic.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -d '{"relic":"honey_bell"}' "http://127.0.0.1:3917/api/v1/runs/$run_id/relic")"
          test "$relic_status" = "409"
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"unit_id":1,"lane":2}' "http://127.0.0.1:3917/api/v1/runs/$run_id/formation" > /tmp/casino-battle-formation.json
          python3 -c 'import json,sys; assert json.load(sys.stdin)["party"][0]["lane"] == 2' < /tmp/casino-battle-formation.json
          curl --fail --silent --show-error -X POST "http://127.0.0.1:3917/api/v1/runs/$run_id/draw" > /dev/null
          curl --fail --silent --show-error -X POST "http://127.0.0.1:3917/api/v1/runs/$run_id/battle" > /dev/null
          merge_status="$(curl --silent --output /tmp/casino-battle-merge-error.json --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -d '{"keeper_id":1,"donor_id":1}' \
            "http://127.0.0.1:3917/api/v1/runs/$run_id/merge")"
          test "$merge_status" = "409"
      - name: Verify PostgreSQL migrations, transactions and restart persistence
        env:
          DATABASE_URL: postgres://casino_battle:casino_battle_ci_only@127.0.0.1:5432/casino_battle_ci
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          start_database_server() {
            BIND_ADDR=127.0.0.1:3918 ./target/debug/casino-battle-server > /tmp/casino-battle-postgres.log 2>&1 &
            database_server_pid=$!
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3918/healthz > /tmp/casino-battle-postgres-health.json; then
                return 0
              fi
              if ! kill -0 "$database_server_pid" 2>/dev/null; then
                cat /tmp/casino-battle-postgres.log
                return 1
              fi
              sleep 1
            done
            cat /tmp/casino-battle-postgres.log
            return 1
          }
          stop_database_server() {
            if [ -n "${database_server_pid:-}" ]; then
              kill "$database_server_pid" 2>/dev/null || true
              wait "$database_server_pid" 2>/dev/null || true
              unset database_server_pid
            fi
          }
          trap stop_database_server EXIT

          start_database_server
          grep -q '"status":"ok"' /tmp/casino-battle-postgres-health.json
          grep -q '"persistence":"postgres"' /tmp/casino-battle-postgres-health.json

          run_json="$(curl --fail --silent --show-error -X POST \
            -H 'content-type: application/json' \
            -d '{}' http://127.0.0.1:3918/api/v1/runs)"
          run_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["run_id"])' <<< "$run_json")"
          python3 -c '
          import json, sys
          data = json.load(sys.stdin)["state"]
          assert "seed" not in data and "rng_state" not in data and "next_unit_id" not in data
          ' <<< "$run_json"

          relic_status="$(curl --silent --output /tmp/casino-battle-no-relic-db.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -d '{"relic":"honey_bell"}' "http://127.0.0.1:3918/api/v1/runs/$run_id/relic")"
          test "$relic_status" = "409"
          formation_status="$(curl --silent --output /tmp/casino-battle-invalid-lane.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -d '{"unit_id":1,"lane":3}' "http://127.0.0.1:3918/api/v1/runs/$run_id/formation")"
          test "$formation_status" = "422"
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"unit_id":1,"lane":1}' "http://127.0.0.1:3918/api/v1/runs/$run_id/formation" > /dev/null
          curl --fail --silent --show-error -X POST "http://127.0.0.1:3918/api/v1/runs/$run_id/draw" > /dev/null
          curl --fail --silent --show-error -X POST "http://127.0.0.1:3918/api/v1/runs/$run_id/battle" > /dev/null
          curl --fail --silent --show-error "http://127.0.0.1:3918/api/v1/runs/$run_id" > /tmp/casino-battle-persisted-before-restart.json

          stop_database_server
          start_database_server
          curl --fail --silent --show-error "http://127.0.0.1:3918/api/v1/runs/$run_id" > /tmp/casino-battle-persisted-after-restart.json
          python3 -c '
          import json
          with open("/tmp/casino-battle-persisted-before-restart.json", encoding="utf-8") as file:
              before = json.load(file)
          with open("/tmp/casino-battle-persisted-after-restart.json", encoding="utf-8") as file:
              after = json.load(file)
          assert before == after, "Run state changed after server restart"
          assert "seed" not in after and "rng_state" not in after and "next_unit_id" not in after
          '
