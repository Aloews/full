name: CI
on:
  push:
    branches: ["main", "foundation/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply non-breaking dependency security fixes
        run: npm audit fix
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Commit reproducible dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]] && [[ -n "$(git status --porcelain -- package-lock.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock audited frontend dependencies"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          fi
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
