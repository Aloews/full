name: AUREL Neon staging smoke
on:
  push:
    branches: [foundation/aurel-neon-function-rc1]
  pull_request:
    branches: [foundation/luxury-estate-platform]
permissions:
  contents: read
jobs:
  staging-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check function readiness
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            https://br-muddy-art-b91lxogu-aurelapi.compute.c-7.eu-central-1.aws.neon.tech/health \
            -o /tmp/aurel-health.json
          node -e "const x=require('/tmp/aurel-health.json'); if(x.ok!==true || x.service!=='aurel-api') process.exit(1); console.log(x)"
      - name: Check public inventory contract
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            'https://br-muddy-art-b91lxogu-aurelapi.compute.c-7.eu-central-1.aws.neon.tech/public/properties?limit=1' \
            -o /tmp/aurel-properties.json
          node -e "const x=require('/tmp/aurel-properties.json'); if(!Array.isArray(x)) process.exit(1); console.log('public properties array:',x.length)"
      - name: Check protected route rejects anonymous requests
        run: |
          code=$(curl --silent --show-error -o /tmp/aurel-unauth.json -w '%{http_code}' \
            https://br-muddy-art-b91lxogu-aurelapi.compute.c-7.eu-central-1.aws.neon.tech/api/v1/properties)
          test "$code" = "401"
      - name: Check enquiry intake is disabled in staging
        run: |
          code=$(curl --silent --show-error -o /tmp/aurel-enquiry.json -w '%{http_code}' -X POST \
            https://br-muddy-art-b91lxogu-aurelapi.compute.c-7.eu-central-1.aws.neon.tech/public/properties/00000000-0000-4000-8000-000000000001/enquiries)
          test "$code" = "503"
